<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web socket</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"
      integrity="sha512-11t8Q+vY9JlCrr+PveZKTYJq8n7O09Y5X/pk/aMd3vJugSvu4xOunGEUzaADqL3I8cZKE/pBwwCfXzDkRJh2sQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script defer src="app.js"></script>
    <!-- //(defer) does'nt load js until the dom is loaded -->
  </head>
  <body>
    <main>
      <form class="form-join">
        <input
          type="text"
          id="name"
          placeholder="Your name"
          maxlength="8"
          size="5"
          required
        />
        <input type="text" id="room" placeholder="Room ID" size="5" required />
        <button id="join">Join</button>
      </form>
      <p class="user-list"></p>

      <ul class="chat-display"></ul>

      <!-- <p class="room-list"></p> -->

      <p class="activity"></p>
      <form class="form-send">
        <input type="text" placeholder="Your message" id="message" />
        <button type="submit">send</button>
      </form>
    </main>
  </body>
</html>
